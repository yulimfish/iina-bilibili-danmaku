<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; padding: 10px;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 12px; color: #eee; background: transparent;
  }
  .tabs { display: flex; gap: 4px; margin-bottom: 10px; }
  .tab {
    flex: 1; padding: 5px 0; text-align: center; cursor: pointer;
    background: #333; color: #ccc; border: none; border-radius: 4px; font-size: 12px;
  }
  .tab.active { background: #1a73e8; color: #fff; }
  .hidden { display: none; }
  .section-title { font-weight: bold; margin: 8px 0 6px; }
  .row { display: flex; gap: 6px; margin: 6px 0; }
  input[type="text"] {
    width: 100%; box-sizing: border-box; padding: 5px 6px;
    background: #222; color: #eee; border: 1px solid #555; border-radius: 4px;
  }
  button.action {
    flex: 1; padding: 5px 0;
    background: #444; color: #eee; border: none; border-radius: 4px; font-size: 12px;
  }
  button.action:disabled { opacity: 0.5; }
  button.action.current { background: #1a73e8; color: #fff; }
  .status { color: #aaa; margin: 6px 0; }
  .status.error { color: #ff8080; }
  .list {
    max-height: 140px; overflow-y: auto;
    border: 1px solid #444; border-radius: 4px; padding: 6px; color: #888;
  }
  .part { padding: 3px 4px; border-radius: 3px; cursor: pointer; color: #ccc; }
  .part:hover { background: #333; }
  .part.current { background: #1a73e8; color: #fff; }
  label.opt { display: block; margin: 6px 0; }
  input[type="range"] { width: 100%; }
  .hint { color: #777; margin-top: 10px; }
  /* stroke: label on its own line, slider + circular chip share the line below */
  .stroke-ctl { display: flex; align-items: center; gap: 6px; margin-top: 4px; }
  .stroke-ctl input[type="range"] { flex: 1 1 auto; width: auto; }
  .color-chip {
    -webkit-appearance: none; appearance: none;
    width: 16px; height: 16px; padding: 0; margin: 0; flex: none;
    border: 2px solid #fff; border-radius: 50%;
    background: transparent; cursor: pointer;
  }
  .color-chip::-webkit-color-swatch-wrapper { padding: 0; }
  .color-chip::-webkit-color-swatch { border: none; border-radius: 50%; }
  /* font combo: text input + custom dropdown panel (WKWebView has no datalist) */
  .combo { position: relative; display: block; }
  .combo input[type="text"] { padding-right: 20px; }
  .combo-arrow {
    position: absolute; right: 7px; top: 50%; transform: translateY(-50%);
    color: #888; pointer-events: none; font-size: 10px;
  }
  .combo-panel {
    position: absolute; left: 0; right: 0; top: 100%; z-index: 30;
    max-height: 180px; overflow-y: auto;
    background: #1c1c1c; border: 1px solid #555; border-radius: 4px;
    margin-top: 2px; padding: 2px 0;
  }
  .font-opt { padding: 4px 8px; cursor: pointer; color: #ddd; white-space: nowrap; }
  .font-opt:hover { background: #333; }
</style>
</head>
<body>
<div class="tabs">
  <button class="tab active" id="tabbtn-source">弹幕源</button>
  <button class="tab" id="tabbtn-settings">设置</button>
</div>

<div id="tab-source">
  <div class="section-title">① 弹幕源</div>
  <div class="row">
    <button class="action" id="mode-bv">BV号/链接</button>
    <button class="action" id="mode-search">搜剧集</button>
  </div>
  <input type="text" id="source-input" placeholder="BV号 / 视频链接 / ep·ss·md 链接">
  <div class="row">
    <button class="action" id="load-btn">▶ 加载弹幕</button>
  </div>
  <div class="status" id="status-line">状态：未加载</div>
  <div class="list" id="part-list">（空）</div>
</div>

<div id="tab-settings" class="hidden">
  <div class="section-title">② 弹幕控制</div>
  <!-- M4: all controls live -->
  <label class="opt"><input type="checkbox" id="set-enabled" checked> 显示弹幕</label>
  <label class="opt"><input type="checkbox" id="set-top" checked> 顶部弹幕</label>
  <label class="opt"><input type="checkbox" id="set-bottom" checked> 底部弹幕</label>
  <label class="opt">字号 <span id="val-fontsize">25</span><input type="range" id="set-fontsize" min="18" max="36" value="25"></label>
  <label class="opt">字体
    <span class="combo">
      <input type="text" id="set-font-family" placeholder="输入或选择字体" autocomplete="off">
      <span class="combo-arrow">▾</span>
      <div id="font-family-list" class="combo-panel hidden"></div>
    </span>
  </label>
  <label class="opt">描边 <span id="val-stroke">1px</span>
    <span class="stroke-ctl"><input type="range" id="set-stroke" min="0" max="3" step="0.5" value="1"><input type="color" id="set-stroke-color" class="color-chip" value="#000000"></span>
  </label>
  <label class="opt">透明度 <span id="val-opacity">100</span><input type="range" id="set-opacity" min="0" max="100" value="100"></label>
  <label class="opt">速度 <span id="val-speed">680</span><input type="range" id="set-speed" min="200" max="1200" value="680"></label>
  <label class="opt">偏移 <span id="val-offset">0s</span><input type="range" id="set-offset" min="-30" max="30" value="0"></label>
  <div class="row">
    <button class="action" id="clear-btn">清空弹幕</button>
    <button class="action" id="reset-offset-btn">重置偏移</button>
  </div>
</div>

<script>
  // Tab switching is local UI state only; structure untouched.
  document.getElementById("tabbtn-source").onclick = () => switchTab("source");
  document.getElementById("tabbtn-settings").onclick = () => switchTab("settings");

  function switchTab(which) {
    const isSource = which === "source";
    document.getElementById("tab-source").classList.toggle("hidden", !isSource);
    document.getElementById("tab-settings").classList.toggle("hidden", isSource);
    document.getElementById("tabbtn-source").classList.toggle("active", isSource);
    document.getElementById("tabbtn-settings").classList.toggle("active", !isSource);
  }

  // M3: BV/link vs bangumi-search input modes.
  let inputMode = "bv";
  const sourceInput = document.getElementById("source-input");
  const loadBtn = document.getElementById("load-btn");
  const modeBv = document.getElementById("mode-bv");
  const modeSearch = document.getElementById("mode-search");

  function setInputMode(mode) {
    inputMode = mode;
    const isSearch = mode === "search";
    modeBv.classList.toggle("current", !isSearch);
    modeSearch.classList.toggle("current", isSearch);
    sourceInput.placeholder = isSearch ? "番剧名称" : "BV号 / 视频链接 / ep·ss·md 链接";
    loadBtn.textContent = isSearch ? "🔍 搜索" : "▶ 加载弹幕";
  }
  modeBv.onclick = () => setInputMode("bv");
  modeSearch.onclick = () => setInputMode("search");
  setInputMode("bv");

  // M2: BV-source channel wiring.
  loadBtn.onclick = () => {
    setStatus("正在加载…", false);
    if (inputMode === "search") {
      iina.postMessage("search-bangumi", { keyword: sourceInput.value });
    } else {
      iina.postMessage("load-source", { text: sourceInput.value });
    }
  };

  function setStatus(text, isError) {
    const el = document.getElementById("status-line");
    el.textContent = "状态：" + text;
    el.classList.toggle("error", !!isError);
  }

  function renderPickList(items, current, onPick) {
    const list = document.getElementById("part-list");
    list.textContent = "";
    items.forEach((label, i) => {
      const div = document.createElement("div");
      div.className = "part" + (i === current ? " current" : "");
      div.textContent = label;
      div.onclick = () => onPick(i);
      list.appendChild(div);
    });
  }

  iina.onMessage("video", (data) => {
    if (!data) {
      return;
    }
    setStatus("「" + data.title + "」", false);
    if (!data.parts || !data.parts.length) {
      document.getElementById("part-list").textContent = data.title || "（空）";
      return;
    }
    // M3: episodes render as 第X集 + long title; BV parts as P1/P2…
    const labels = data.parts.map((p) =>
      data.kind === "episodes" ? "第" + p.page + "集 " + (p.part || "") : "P" + p.page + " " + (p.part || ""));
    renderPickList(labels, data.current, (i) => iina.postMessage("select-part", { index: i }));
  });

  // M3: season search results -> episode list.
  iina.onMessage("seasons", (data) => {
    if (!data || !data.seasons) {
      return;
    }
    const labels = data.seasons.map((s) => s.title + (s.year ? " (" + s.year + ")" : ""));
    renderPickList(labels, -1, (i) =>
      iina.postMessage("select-season", { season_id: data.seasons[i].season_id }));
  });

  iina.onMessage("status", (data) => {
    if (data) {
      setStatus(data.text, false);
    }
  });

  iina.onMessage("error", (data) => {
    if (data) {
      setStatus(data.message, true);
    }
  });

  // Handshake with main.js; sidebar webview cannot touch iina API directly.
  iina.onMessage("state", (data) => {
    if (data && data.status === "idle") {
      setStatus("未加载", false);
    }
  });

  // M4: settings controls.
  const ctl = {
    enabled: document.getElementById("set-enabled"),
    showTop: document.getElementById("set-top"),
    showBottom: document.getElementById("set-bottom"),
    fontSize: document.getElementById("set-fontsize"),
    fontFamily: document.getElementById("set-font-family"),
    strokeWidth: document.getElementById("set-stroke"),
    strokeColor: document.getElementById("set-stroke-color"),
    opacity: document.getElementById("set-opacity"),
    speed: document.getElementById("set-speed"),
    offset: document.getElementById("set-offset")
  };

  function patchFromUI() {
    return {
      enabled: ctl.enabled.checked,
      showTop: ctl.showTop.checked,
      showBottom: ctl.showBottom.checked,
      fontSize: parseInt(ctl.fontSize.value, 10),
      fontFamily: ctl.fontFamily.value.trim(),
      strokeWidth: parseFloat(ctl.strokeWidth.value),
      strokeColor: ctl.strokeColor.value,
      opacity: parseInt(ctl.opacity.value, 10),
      speed: parseInt(ctl.speed.value, 10),
      offset: parseInt(ctl.offset.value, 10)
    };
  }

  function refreshValueLabels() {
    document.getElementById("val-fontsize").textContent = ctl.fontSize.value;
    document.getElementById("val-stroke").textContent = ctl.strokeWidth.value + "px";
    document.getElementById("val-opacity").textContent = ctl.opacity.value;
    document.getElementById("val-speed").textContent = ctl.speed.value;
    document.getElementById("val-offset").textContent = ctl.offset.value + "s";
  }

  Object.keys(ctl).forEach((k) => {
    ctl[k].onchange = () => {
      refreshValueLabels();
      const patch = {};
      patch[k] = patchFromUI()[k];
      iina.postMessage("update-settings", { patch: patch });
    };
  });
  refreshValueLabels();

  document.getElementById("clear-btn").onclick = () => {
    iina.postMessage("clear-danmaku", {});
  };
  document.getElementById("reset-offset-btn").onclick = () => {
    iina.postMessage("update-settings", { patch: { offset: 0 } });
  };

  iina.onMessage("settings", (data) => {
    if (!data || !data.settings) {
      return;
    }
    const s = data.settings;
    ctl.enabled.checked = s.enabled !== false;
    ctl.showTop.checked = s.showTop !== false;
    ctl.showBottom.checked = s.showBottom !== false;
    ctl.fontSize.value = s.fontSize;
    ctl.fontFamily.value = s.fontFamily;
    ctl.strokeWidth.value = s.strokeWidth;
    ctl.strokeColor.value = /^#[0-9a-fA-F]{6}$/.test(s.strokeColor) ? s.strokeColor : "#000000";
    ctl.opacity.value = s.opacity;
    ctl.speed.value = s.speed;
    ctl.offset.value = s.offset;
    refreshValueLabels();
  });

  // Font combo (custom dropdown; WKWebView does not render datalist).
  // Performance: option nodes are built once per font-list via a single
  // DocumentFragment insertion; typing only toggles style.display on existing
  // nodes and never posts messages (patch fires on change/blur/pick only).
  const FONT_PRESET_ITEMS = [
    { value: "system", label: "系统默认" },
    { value: "sans", label: "无衬线" },
    { value: "serif", label: "宋体" },
    { value: "rounded", label: "圆体" },
    { value: "mono", label: "等宽" }
  ];
  const FALLBACK_FONTS = [
    "PingFang SC", "Songti SC", "Heiti SC", "Hiragino Sans GB",
    "Kaiti SC", "Yuanti SC", "Lantinghei SC", "Microsoft YaHei",
    "SimHei", "Arial", "Helvetica Neue", "Menlo", "Monaco",
    "Times New Roman", "Georgia", "Courier New"
  ];
  const FONT_PANEL_CAP = 500;
  let fontExtras = FALLBACK_FONTS.slice();
  const fontPanel = document.getElementById("font-family-list");
  const fontInput = ctl.fontFamily;
  let fontNodes = []; // { node, hay, value } — rebuilt only on font-list arrival

  function buildFontPanel() {
    const seen = new Set();
    const items = [];
    FONT_PRESET_ITEMS.forEach((p) => {
      seen.add(p.value);
      items.push(p);
    });
    fontExtras.forEach((name) => {
      if (typeof name === "string" && name && !seen.has(name)) {
        seen.add(name);
        items.push({ value: name, label: name });
      }
    });
    const frag = document.createDocumentFragment();
    fontNodes = [];
    items.slice(0, FONT_PANEL_CAP).forEach((item) => {
      const div = document.createElement("div");
      div.className = "font-opt";
      div.textContent = item.label;
      div.dataset.value = item.value;
      div.onmousedown = () => pickFont(item.value);
      frag.appendChild(div);
      fontNodes.push({ node: div, hay: (item.label + " " + item.value).toLowerCase(), value: item.value });
    });
    fontPanel.textContent = "";
    fontPanel.appendChild(frag);
    filterFontPanel();
  }

  function filterFontPanel() {
    const q = fontInput.value.trim().toLowerCase();
    for (let i = 0; i < fontNodes.length; i++) {
      const hit = !q || fontNodes[i].hay.indexOf(q) >= 0;
      fontNodes[i].node.style.display = hit ? "" : "none";
    }
  }

  function openFontPanel() {
    fontPanel.classList.remove("hidden");
    // Opening must show the FULL list: the input already holds the committed
    // value (e.g. "system"), filtering by it on open would hide every other
    // font. Filtering happens only on explicit typing (input events).
    for (let i = 0; i < fontNodes.length; i++) {
        fontNodes[i].node.style.display = "";
    }
  }

  function closeFontPanel() {
    fontPanel.classList.add("hidden");
  }

  function pickFont(value) {
    fontInput.value = value;
    closeFontPanel();
    if (fontInput.onchange) {
      fontInput.onchange();
    }
  }

  fontInput.addEventListener("focus", () => {
    openFontPanel();
    if (typeof fontInput.select === "function") {
      fontInput.select();
    }
  });
  fontInput.addEventListener("input", () => {
    if (fontPanel.classList.contains("hidden")) {
      fontPanel.classList.remove("hidden");
    }
    filterFontPanel();
  });
  fontInput.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
      closeFontPanel();
    }
  });
  document.addEventListener("mousedown", (e) => {
    if (fontPanel.classList.contains("hidden")) {
      return;
    }
    const t = e.target;
    if (t !== fontInput && !fontPanel.contains(t)) {
      closeFontPanel();
    }
  });

  // font-list: main.js sends installed system fonts; presets kept, extras replaced.
  iina.onMessage("font-list", (data) => {
    const fonts = data && data.fonts;
    if (!Array.isArray(fonts) || fonts.length === 0) {
      return;
    }
    const seen = new Set(FONT_PRESET_ITEMS.map((p) => p.value));
    const extras = [];
    for (const name of fonts) {
      if (typeof name === "string" && name && !seen.has(name)) {
        seen.add(name);
        extras.push(name);
      }
    }
    fontExtras = extras.slice(0, FONT_PANEL_CAP - FONT_PRESET_ITEMS.length);
    buildFontPanel();
  });

  buildFontPanel();
  iina.postMessage("sidebar-ready", {});
</script>
</body>
</html>
