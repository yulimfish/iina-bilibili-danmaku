<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Bili Danmaku Overlay</title>
<link rel="stylesheet" href="vendor/ccl.min.css">
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
  #stage { position: fixed; inset: 0; }
  #commentCanvas { position: absolute; inset: 0; }
  .abp .container .cmt {
    -webkit-text-stroke-width: var(--danmaku-stroke-width, 1px);
    -webkit-text-stroke-color: var(--danmaku-stroke-color, #000);
  }
</style>
<script src="vendor/CommentCoreLibrary.js"></script>
</head>
<body>
<div id="stage" class="abp"><div id="commentCanvas" class="container"></div></div>
<script src="danmaku-parser.js"></script>
<script src="danmaku.js"></script>
</body>
</html>
